autoGeneratePrompts: true
autoRelease: false
maxContainers: 8
pr: true
preflightCommand: "make precommit"
preflightInterval: "8h"
testCommand: "make test"
validationPrompt: docs/dod.md
workflow: worktree
env:
  GOPATH: /home/node/go
  GOCACHE: /home/node/.cache/go-build
  GOLANGCI_LINT_CACHE: /home/node/.cache/golangci-lint
  GO_TEST_PARALLEL: "4"
  GOFLAGS: "-buildvcs=false"
  # The repo's script tests start a stub HTTP store on 127.0.0.1; without this the
  # container's HTTP_PROXY intercepts it and `make test` fails with
  # "stub attention store never answered" (scripts/session-self-exit-test.sh).
  NO_PROXY: "127.0.0.1,localhost"
extraMounts:
  - src: ${GOPATH}/pkg
    dst: /home/node/go/pkg
  - src: ${HOST_CACHE_DIR}/go-build
    dst: /home/node/.cache/go-build
  - src: ${HOST_CACHE_DIR}/golangci-lint
    dst: /home/node/.cache/golangci-lint
